<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="description" content="Sistema Integral SVB · Vincular Business: infraestructura, contratos, CRM, caja, RRHH, CMS y portal de clientes.">
<title>Sistema Integral SVB · Vincular Business</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C8CFF'/%3E%3Cstop offset='1' stop-color='%2338BDF8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial' font-size='24' font-weight='700' text-anchor='middle' fill='%2307090D'%3EVB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink-950:#07090D;--ink-900:#0B0E14;--ink-850:#10141C;--ink-800:#151A24;--ink-700:#1E2533;--ink-600:#2A3344;
  --fg:#E6EAF2;--fg-muted:#9AA4B6;--fg-subtle:#6B768A;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.04);
  --brand:#7C8CFF;--ok:#22E39B;--warn:#FFC53D;--crit:#FF4D6A;--info:#38BDF8;
  --radius:16px;--font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink-950);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(1200px 600px at 10% -10%,rgba(124,140,255,.08),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(56,189,248,.05),transparent 60%);background-attachment:fixed;min-height:100vh}
*{scrollbar-width:thin;scrollbar-color:#2A3344 transparent}
::selection{background:rgba(124,140,255,.35)}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-muted)}.subtle{color:var(--fg-subtle)}.small{font-size:12px}.xs{font-size:11px}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-crit{color:var(--crit)}.t-info{color:var(--info)}.t-brand{color:var(--brand)}
.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}.b{font-weight:600}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:248px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(11,14,20,.85);padding:20px 12px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;padding:0 12px;margin-bottom:28px}
.logo-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--info));color:var(--ink-950);font-weight:800;font-size:13px}
.logo b{display:block;font-size:14px}.logo span{font-size:11px;color:var(--fg-subtle)}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--fg-muted);transition:.15s}
.nav a:hover{background:rgba(255,255,255,.03);color:var(--fg)}
.nav a.active{background:rgba(255,255,255,.06);color:var(--fg)}
.nav a.active svg{color:var(--brand)}
.nav svg{width:16px;height:16px;color:var(--fg-subtle);flex-shrink:0}
.nav .badge{margin-left:auto;background:rgba(255,77,106,.15);color:var(--crit);font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
.side-foot{padding:0 12px;font-size:10px;color:var(--fg-subtle);line-height:1.6}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.75);backdrop-filter:blur(16px)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--ink-900);border-radius:12px;padding:0 12px;height:38px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg)}
.search svg{width:16px;color:var(--fg-subtle)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{position:relative;background:none;border:0;border-radius:12px;padding:8px;color:var(--fg-muted);cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.05)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 10px var(--crit)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink-700);font-weight:700}
.who{text-align:right;line-height:1.2}.who b{display:block;font-size:13px}.who span{font-size:11px;color:var(--fg-subtle)}
.content{max-width:1400px;margin:0 auto;padding:28px 24px 60px}
.menu-toggle{display:none}

/* Headings */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.ph h1{font-size:24px;font-weight:650;letter-spacing:-.01em}
.ph p{color:var(--fg-muted);margin-top:4px}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}

/* Grid */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.mt{margin-top:20px}.mb{margin-bottom:20px}.gap{gap:20px}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}

/* Cards */
.card{border:1px solid var(--line);background:rgba(16,20,28,.82);border-radius:var(--radius);box-shadow:0 8px 24px -12px rgba(0,0,0,.6);overflow:hidden}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:14px;font-weight:600}.card-h p{font-size:12px;color:var(--fg-subtle);margin-top:2px}
.card-b{padding:20px}
.kpi{position:relative;padding:18px 20px;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;filter:blur(28px);opacity:.22;background:var(--glow,transparent)}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle)}
.kpi .v{font-size:25px;font-weight:650;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .h{font-size:12px;color:var(--fg-muted);margin-top:4px}
.kpi.ok{--glow:var(--ok)}.kpi.warn{--glow:var(--warn)}.kpi.crit{--glow:var(--crit)}.kpi.info{--glow:var(--info)}.kpi.brand{--glow:var(--brand)}

/* Pills / dots */
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:550;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--fg-muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:var(--d,none)}
.pill.dot{--d:inline-block}
.pill.ok{background:rgba(34,227,155,.1);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(34,227,155,.25)}
.pill.warn{background:rgba(255,197,61,.1);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(255,197,61,.25)}
.pill.crit{background:rgba(255,77,106,.1);color:var(--crit);box-shadow:inset 0 0 0 1px rgba(255,77,106,.25)}
.pill.info{background:rgba(56,189,248,.1);color:var(--info);box-shadow:inset 0 0 0 1px rgba(56,189,248,.25)}
.pill.brand{background:rgba(124,140,255,.12);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(124,140,255,.3)}
.sdot{position:relative;display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;flex-shrink:0}
.sdot.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
@keyframes blink{50%{opacity:.35}}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-subtle)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:12px;border:0;font-weight:550;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:10px}
.btn.primary{background:var(--brand);color:var(--ink-950)}.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.success{background:var(--ok);color:var(--ink-950)}.btn.success:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{background:rgba(255,77,106,.14);color:var(--crit);box-shadow:inset 0 0 0 1px rgba(255,77,106,.3)}
.btn.outline{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.btn.outline:hover{background:rgba(255,255,255,.04)}
.btn.ghost{background:transparent;color:var(--fg-muted)}.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.btn.block{width:100%}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:550;color:var(--fg-muted);margin-bottom:6px}
.field>small{display:block;font-size:11px;color:var(--fg-subtle);margin-top:4px}
.in{width:100%;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:var(--ink-900);padding:0 12px;outline:0;transition:.15s}
textarea.in{height:auto;padding:10px 12px;resize:vertical}
.in:focus{border-color:rgba(124,140,255,.6);box-shadow:0 0 0 3px rgba(124,140,255,.15)}
input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.fgrid .full{grid-column:1/-1}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11px;font-weight:550;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);padding:11px 20px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 20px;border-bottom:1px solid var(--line2);color:var(--fg-muted);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}tbody tr:hover{background:rgba(255,255,255,.02)}
tr.sel{background:rgba(255,255,255,.035)}
td .t{color:var(--fg);font-weight:500}td .s{font-size:11px;color:var(--fg-subtle);margin-top:2px}
.empty{padding:36px 20px;text-align:center;color:var(--fg-subtle)}
.list>li{list-style:none;padding:12px 20px;border-bottom:1px solid var(--line2)}.list>li:last-child{border-bottom:0}

/* Bars */
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));box-shadow:0 0 10px var(--c,var(--brand))}

/* Tabs */
.tabs{display:inline-flex;gap:4px;background:var(--ink-900);padding:4px;border-radius:12px}
.tabs button{background:none;border:0;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:550;color:var(--fg-subtle);cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.08);color:var(--fg)}

/* Modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,5,8,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;background:var(--ink-850);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.modal.wide{max-width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--ink-850);z-index:1}
.modal-h h3{font-size:16px}
.modal-b{padding:22px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line2)}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{min-width:260px;max-width:380px;padding:12px 16px;border-radius:14px;background:var(--ink-800);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(0,0,0,.7);font-size:13px;animation:slide .2s}
.toast.ok{border-color:rgba(34,227,155,.35)}.toast.err{border-color:rgba(255,77,106,.45)}.toast.warn{border-color:rgba(255,197,61,.4)}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
.drawer{position:fixed;right:20px;top:72px;z-index:40;width:360px;max-height:70vh;overflow:auto}

/* Misc */
.tile{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:rgba(11,14,20,.6);border-radius:14px;padding:12px 15px;cursor:pointer;transition:.15s}
.tile:hover{border-color:rgba(255,255,255,.1)}
.chart{width:100%;height:260px;display:block}
.notice{border:1px solid rgba(255,197,61,.2);background:rgba(255,197,61,.06);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:20px}
.plan{position:relative;padding:24px;overflow:hidden}
.plan.ai{box-shadow:inset 0 0 0 1px rgba(124,140,255,.4)}
.plan.ai::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(124,140,255,.2);filter:blur(40px)}
.plan ul{list-style:none;margin-top:14px}.plan li{display:flex;gap:8px;padding:4px 0;color:var(--fg-muted)}.plan li::before{content:"✓";color:var(--ok)}
.check{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.08);cursor:pointer;border:0}
.check.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hash{font-family:var(--mono);font-size:11px;color:var(--fg-subtle)}
.bubble{border-radius:14px;padding:10px 14px;margin-bottom:10px;background:var(--ink-800);border:1px solid var(--line2)}
.bubble.mine{background:rgba(124,140,255,.1);border-color:rgba(124,140,255,.25)}
.bubble.internal{background:rgba(255,197,61,.06);border-color:rgba(255,197,61,.25)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:760px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ucard{text-align:left;border:1px solid var(--line);background:var(--ink-900);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.ucard:hover{border-color:rgba(124,140,255,.5);transform:translateY(-1px)}
.ucard b{display:block}.ucard span{font-size:12px;color:var(--fg-subtle)}

/* Landing preview */
.lp{background:#0d1117;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.lp-hero{padding:48px 32px;text-align:center;background:radial-gradient(600px 300px at 50% 0,rgba(124,140,255,.25),transparent)}
.lp-hero h2{font-size:30px;letter-spacing:-.02em}.lp-hero p{color:var(--fg-muted);margin-top:10px}
.lp-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 32px 24px}
.lp-feat div{background:var(--ink-850);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px}
.lp-form{max-width:420px;margin:0 auto;padding:0 32px 36px}

/* Print */
@media print{body{background:#fff;color:#000}.no-print{display:none!important}}

/* Responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}
@media (max-width:860px){
  .side{position:fixed;left:-260px;z-index:45;transition:.2s}.side.open{left:0}
  .menu-toggle{display:inline-flex}.g2,.g4{grid-template-columns:1fr}.who{display:none}.search{display:none}
  .content{padding:20px 14px 60px}.lp-feat{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}
}

/* ═══════ v2 nube · tema claro/oscuro · animaciones · acceso · atención ═══════ */
html{color-scheme:dark}
html[data-theme=light]{color-scheme:light;--ink-950:#F4F6FB;--ink-900:#FFFFFF;--ink-850:#FFFFFF;--ink-800:#FFFFFF;--ink-700:#E8ECF4;--ink-600:#D5DBE7;--fg:#0F172A;--fg-muted:#475569;--fg-subtle:#64748B;--line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.05);--brand:#4F5BD5;--ok:#0E9F6E;--warn:#B7791F;--crit:#E02D4B;--info:#0284C7}
html[data-theme=light] body{background-image:radial-gradient(1200px 600px at 10% -10%,rgba(79,91,213,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(2,132,199,.07),transparent 60%)}
html[data-theme=light] .side{background:rgba(255,255,255,.9)}
html[data-theme=light] .top{background:rgba(244,246,251,.8)}
html[data-theme=light] .card{background:rgba(255,255,255,.92);box-shadow:0 10px 30px -18px rgba(15,23,42,.25)}
html[data-theme=light] .nav a:hover,html[data-theme=light] .iconbtn:hover,html[data-theme=light] .btn.ghost:hover,html[data-theme=light] .btn.outline:hover{background:rgba(15,23,42,.05)}
html[data-theme=light] .nav a.active,html[data-theme=light] .tabs button.on{background:rgba(79,91,213,.12);color:var(--brand)}
html[data-theme=light] .pill{box-shadow:inset 0 0 0 1px rgba(15,23,42,.12);background:rgba(15,23,42,.03)}
html[data-theme=light] .btn.outline{box-shadow:inset 0 0 0 1px rgba(15,23,42,.18)}
html[data-theme=light] .in{border-color:rgba(15,23,42,.14)}
html[data-theme=light] tbody tr:hover{background:rgba(15,23,42,.025)}
html[data-theme=light] tr.sel{background:rgba(79,91,213,.07)}
html[data-theme=light] .bar,html[data-theme=light] .check{background:rgba(15,23,42,.08)}
html[data-theme=light] .tile{background:#fff}
html[data-theme=light] .modal,html[data-theme=light] .toast{box-shadow:0 30px 80px -30px rgba(15,23,42,.45)}
html[data-theme=light] .logo-mark{color:#fff}

/* animaciones suaves */
@media (prefers-reduced-motion:no-preference){
  #view{animation:viewin .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{transition:transform .18s,box-shadow .18s,border-color .18s}
  .kpi:hover,.tile:hover{transform:translateY(-2px)}
  .nav a{transition:background .15s,color .15s,transform .15s}.nav a:hover{transform:translateX(2px)}
  .btn:active{transform:scale(.97)}
}

/* indicador de nube */
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--fg-muted);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.sync svg{width:15px;height:15px}.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync.sync i{background:var(--info);box-shadow:0 0 8px var(--info);animation:pulse 1s infinite}
.sync.err i{background:var(--crit);box-shadow:0 0 8px var(--crit)}
.sync.off i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
@keyframes pulse{50%{opacity:.35}}
.install-btn{color:var(--brand)}
@media (max-width:860px){.sync b{display:none}}

/* pantalla de acceso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:420px;padding:30px 28px;border-radius:24px;border:1px solid var(--line);background:var(--ink-850);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:viewin .35s}
.gate-logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#07090D;background:linear-gradient(135deg,#7C8CFF,#38BDF8);box-shadow:0 12px 30px -10px rgba(124,140,255,.7);margin-bottom:16px}
.gate h1{font-size:22px;margin:0 0 4px}.gate p{margin:0}
.gbtn{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--ink-900);color:var(--fg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.15s}
.gbtn:hover{border-color:var(--brand)}
.or{display:flex;align-items:center;gap:10px;color:var(--fg-subtle);font-size:12px;margin:16px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gate form .in{height:44px;margin-bottom:10px}
.gate .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.gate .links a{cursor:pointer}
.gate-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:rot .8s linear infinite;margin:6px auto 14px}
@keyframes rot{to{transform:rotate(360deg)}}

/* atención al público: chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:16px;max-height:52vh;min-height:220px;overflow:auto}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:viewin .2s}
.msg small{display:block;font-size:10.5px;opacity:.65;margin-top:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#7C8CFF,#5B6CF0);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--ink-700);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--fg-subtle);font-size:12px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:140px}
.pub{min-height:100vh;padding:24px 14px 60px}
.pub-wrap{max-width:720px;margin:0 auto}
.pub-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.chans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.chan{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ink-850);color:var(--fg);text-decoration:none;font-weight:600;font-size:13px;transition:.15s}
.chan:hover{border-color:var(--brand);transform:translateY(-2px)}.chan svg{width:20px;height:20px}
.chan.wa{color:#22C55E}.chan.ig{color:#E1306C}.chan.fb{color:#3B82F6}.chan.mail{color:var(--info)}
.inbox{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.inbox-list{max-height:calc(100vh - 230px);overflow:auto}
.conv{display:block;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s}
.conv:hover{background:rgba(124,140,255,.06)}.conv.on{background:rgba(124,140,255,.12)}
.conv .n{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.conv .p{font-size:12px;color:var(--fg-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.conv.unread .n:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);flex-shrink:0;margin-top:5px}
@media (max-width:960px){.inbox{grid-template-columns:1fr}.inbox-list{max-height:320px}}

/* paleta de comandos */
.pal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;justify-content:center;padding-top:12vh}
.pal-box{width:min(560px,92vw);background:var(--ink-850);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);height:max-content;animation:viewin .18s}
.pal-box input{width:100%;height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);padding:0 18px;font-size:15px;outline:0}
.pal-box ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal-box li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px}
.pal-box li svg{width:16px;height:16px;color:var(--fg-subtle)}
.pal-box li.on,.pal-box li:hover{background:rgba(124,140,255,.12)}
.pal-box li span{margin-left:auto;font-size:11px;color:var(--fg-subtle)}
/* botón flotante de ayuda en el acceso */
.fab{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:99px;border:0;background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;font-weight:700;box-shadow:0 14px 30px -10px rgba(34,197,94,.7);text-decoration:none}
.fab svg{width:20px;height:20px}
</style>

function drawChart(canvas, data, { key, warn, crit, unit, max, color = "#7C8CFF" }) {

const V = "12.19.0", B = `https://www.gstatic.com/firebasejs/${V}/`;
try {
  const [app, auth, fs] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  window.FB = { app, auth, fs, version: V };
  window.dispatchEvent(new Event("fb-ready"));
} catch (e) {
  console.error("Firebase no cargó", e);
  window.FB = null; window.FB_ERROR = e;
  window.dispatchEvent(new Event("fb-ready"));
}
</script>
